services:
  app:
    image: eleven-force:local
    container_name: eleven_force
    build:
      context: .
    environment:
      NODE_ENV: production
      PORT: 3010
      DATABASE_PATH: /app/data/eleven-force.sqlite
      TRUST_PROXY: "1"
      ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH:-}"
    ports:
      - "127.0.0.1:18084:3010"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 120
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
